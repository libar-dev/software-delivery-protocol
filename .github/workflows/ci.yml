name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        # The check gate builds the package. Skip prepare here to avoid building it twice.
        run: npm ci --ignore-scripts

      - name: Check
        run: npm run check

      - name: Install the committed package
        run: npm run test:git-install
