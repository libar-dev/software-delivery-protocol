pec-studio">The Spec Studio is a static HTML workbench over the one graph · spec:consumers.spec-studio · stated ready / floor ready</li><li id="spec-spec%3Adecisions.studio-html-surface">The Studio renders HTML, and the HTML stays derived · spec:decisions.studio-html-surface · stated ready / floor ready</li><li id="spec-spec%3Aconsumers.spec-studio.data">The Studio renders from the reader's values and embeds only what its script reads · spec:consumers.spec-studio.data · stated ready / floor ready</li><li id="spec-spec%3Aconsumers.spec-studio.data.recipe-answers">A page takes each recipe answer from the recipe's shipped body · spec:consumers.spec-studio.data.recipe-answers · stated ready / floor ready</li><li id="spec-spec%3Aconsumers.spec-studio.data.inputs">The Studio reads two named inputs beside the graph, a base graph and run records · spec:consumers.spec-studio.data.inputs · stated ready / floor ready</li><li id="spec-spec%3Aconsumers.spec-studio.data.inputs.graph-only">Without inputs the page set is the graph's alone · spec:consumers.spec-studio.data.inputs.graph-only · stated ready / floor ready</li><li id="spec-spec%3Aconsumers.spec-studio.data.inputs.both-given">Both inputs add their pages, named, and the same inputs write the same bytes · spec:consumers.spec-studio.data.inputs.both-given · stated ready / floor ready</li><li id="spec-spec%3Aconsumers.spec-studio.publisher">`sdp studio` publishes the Studio as one page set · spec:consumers.spec-studio.publisher · stated ready / floor ready</li><li id="spec-spec%3Aconsumers.spec-studio.publisher.watch">`sdp studio --watch` rebuilds the page set on each carrier change · spec:consumers.spec-studio.publisher.watch · stated ready / floor ready</li><li id="spec-spec%3Aconsumers.spec-studio.publisher.watch.matches-plain-run">Each watch cycle writes the page set a plain run writes · spec:consumers.spec-studio.publisher.watch.matches-plain-run · stated ready / floor ready</li><li id="spec-spec%3Aconsumers.spec-studio.shell">The Studio's shell frames every page with navigation, a rail and a canvas · spec:consumers.spec-studio.shell · stated ready / floor ready</li><li id="spec-spec%3Aconsumers.spec-studio.search">Search finds a Spec, a Pack, an entry or a bound file by a word · spec:consumers.spec-studio.search · stated ready / floor ready</li><li id="spec-spec%3Aconsumers.spec-studio.navigation">Every page of the page set is reached from the top navigation and the index · spec:consumers.spec-studio.navigation · stated ready / floor ready</li><li id="spec-spec%3Aconsumers.spec-studio.lenses">Four lenses read the graph as Packs, architecture, tests and evidence · spec:consumers.spec-studio.lenses · stated ready / floor ready</li><li id="spec-spec%3Aconsumers.spec-studio.lenses.packs">The Packs lens groups every Spec by the Packs that hold it · spec:consumers.spec-studio.lenses.packs · stated ready / floor ready</li><li id="spec-spec%3Aconsumers.spec-studio.index-page">The index says where the corpus stands and narrows every Spec · spec:consumers.spec-studio.index-page · stated ready / floor ready</li><li id="spec-spec%3Aconsumers.spec-studio.lenses.architecture">The architecture lens draws components by context and layer, the planned beside the built · spec:consumers.spec-studio.lenses.architecture · stated ready / floor ready</li><li id="spec-spec%3Aconsumers.spec-studio.lenses.architecture.planned-apart">A component design no anchor realizes draws planned beside the built one · spec:consumers.spec-studio.lenses.architecture.planned-apart · stated ready / floor ready</li><li id="spec-spec%3Aconsumers.spec-studio.lenses.tests">The tests lens shows how far each Spec's verification reaches · spec:consumers.spec-studio.lenses.tests · stated ready / floor ready</li><li id="spec-spec%3Aconsumers.spec-studio.lenses.tests.coverage-row">A Spec's row on the tests lens counts its exercised keyed rules · spec:consumers.spec-studio.lenses.tests.coverage-row · stated ready / floor ready</li><
