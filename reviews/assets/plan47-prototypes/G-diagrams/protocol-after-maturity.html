id="diagram.protocol.maturity.text"><summary>The diagram as text and member lists</summary><table><caption>Rows are stated readiness; columns are floor reached. Counts are memberships, not completion scores.</caption><thead><tr><th>Statement / floor</th><th>none</th><th>idea</th><th>scoped</th><th>defined</th><th>ready</th></tr></thead><tbody><tr><th>idea</th><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><th>scoped</th><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><th>defined</th><td>0</td><td>0</td><td>0</td><td>0</td><td>0</td></tr><tr><th>ready</th><td>0</td><td>0</td><td>0</td><td>0</td><td>63</td></tr></tbody></table></details><details class="branch-list" id="protocol.ready.ready"><summary>stated ready, floor ready: 63 members</summary><ul><li><a id="spec-spec%3Aconsumers.spec-studio" href="#spec-spec%3Aconsumers.spec-studio">The Spec Studio is a static HTML workbench over the one graph</a> · spec:consumers.spec-studio</li><li><a id="spec-spec%3Adecisions.studio-html-surface" href="#spec-spec%3Adecisions.studio-html-surface">The Studio renders HTML, and the HTML stays derived</a> · spec:decisions.studio-html-surface</li><li><a id="spec-spec%3Aconsumers.spec-studio.data" href="#spec-spec%3Aconsumers.spec-studio.data">The Studio renders from the reader's values and embeds only what its script reads</a> · spec:consumers.spec-studio.data</li><li><a id="spec-spec%3Aconsumers.spec-studio.data.recipe-answers" href="#spec-spec%3Aconsumers.spec-studio.data.recipe-answers">A page takes each recipe answer from the recipe's shipped body</a> · spec:consumers.spec-studio.data.recipe-answers</li><li><a id="spec-spec%3Aconsumers.spec-studio.data.inputs" href="#spec-spec%3Aconsumers.spec-studio.data.inputs">The Studio reads two named inputs beside the graph, a base graph and run records</a> · spec:consumers.spec-studio.data.inputs</li><li><a id="spec-spec%3Aconsumers.spec-studio.data.inputs.graph-only" href="#spec-spec%3Aconsumers.spec-studio.data.inputs.graph-only">Without inputs the page set is the graph's alone</a> · spec:consumers.spec-studio.data.inputs.graph-only</li><li><a id="spec-spec%3Aconsumers.spec-studio.data.inputs.both-given" href="#spec-spec%3Aconsumers.spec-studio.data.inputs.both-given">Both inputs add their pages, named, and the same inputs write the same bytes</a> · spec:consumers.spec-studio.data.inputs.both-given</li><li><a id="spec-spec%3Aconsumers.spec-studio.publisher" href="#spec-spec%3Aconsumers.spec-studio.publisher">`sdp studio` publishes the Studio as one page set</a> · spec:consumers.spec-studio.publisher</li><li><a id="spec-spec%3Aconsumers.spec-studio.publisher.watch" href="#spec-spec%3Aconsumers.spec-studio.publisher.watch">`sdp studio --watch` rebuilds the page set on each carrier change</a> · spec:consumers.spec-studio.publisher.watch</li><li><a id="spec-spec%3Aconsumers.spec-studio.publisher.watch.matches-plain-run" href="#spec-spec%3Aconsumers.spec-studio.publisher.watch.matches-plain-run">Each watch cycle writes the page set a plain run writes</a> · spec:consumers.spec-studio.publisher.watch.matches-plain-run</li><li><a id="spec-spec%3Aconsumers.spec-studio.shell" href="#spec-spec%3Aconsumers.spec-studio.shell">The Studio's shell frames every page with navigation, a rail and a canvas</a> · spec:consumers.spec-studio.shell</li><li><a id="spec-spec%3Aconsumers.spec-studio.search" href="#spec-spec%3Aconsumers.spec-studio.search">Search finds a Spec, a Pack, an entry or a bound file by a word</a> · spec:consumers.spec-studio.search</li><li><a id="spec-spec%3Aconsumers.spec-studio.navigation" href="#spec-spec%3Aconsumers.spec-studio.navigation">Every page of the page set is reached from the top navigation and the index</a> · spec:consumers.spec-studio.navigation</li><li><a id="spec-spec%3Aconsumers.spec-studio.lenses" href="#spec-spec%3Aconsumers.spec-studio.lenses">Four lenses read the graph as Packs, architecture, tests and evidence</a> · spec:consumers.spec-studio.lenses</li><li><a id="spec-spec%3Aconsumers.spec-studio.lenses.packs" href="#spec-spec%3Aconsumers.spec-studio.lenses.packs">The Packs lens groups every Spec by the Packs that hold it</a> · spec:consumers.spec-studio.lenses.packs</li><li><a id="spec-spec%3Aconsumers.spec-studio.index-page" href="#spec-spec%3Aconsumers.spec-studio.index-page">The index says where the corpus stands and narrows every Spec</a> · spec:consumers.spec-studio.index-page</li><li><a id="spec-spec%3Aconsumers.spec-studio.lenses.architecture" href="#spec-spec%3Aconsumers.spec-studio.lenses.architecture">The architecture lens draws components by context and layer, the planned beside the built</a> · spec:consumers.spec-studio.lenses.architecture</li><li><a id="spec-spec%3Aconsumers.spec-studio.lenses.architecture.planned-apart" href="#spec-spec%3Aconsumers.spec-studio.lenses.architecture.planned-apart">A component design no anchor realizes draws planned beside the built one</a> · spec:consumers.spec-studio.lenses.architecture.planned-apart</li><li><a id="spec-spec%3Aconsumers.spec-studio.lenses.tests" href="#spec-spec%3Aconsumers.spec-studio.lenses.tests">The tests lens shows how far each Spec's verification reaches</a> · spec:consumers.spec-studio.lenses.tests</li><li><a id="spec-spec%3Aconsumers.spec-studio.lenses.tests.coverage-row" href="#spec-spec%3Aconsumers.spec-studio.lenses.tests.coverage-row">A Spec's row on the tests lens counts its exercised keyed rules</a> · spec:consumers.spec-studio.lenses.tests.coverage-row</li><li><a id="spec-spec%3Aconsumers.agent-surface.example-space-coverage" href="#spec-spec%3Aconsumers.agent-surface.example-space-coverage">Example spaces report which values their examples cover</a> · spec:consumers.agent-surface.example-space-coverage</li><li><a id="spec-spec%3Aconsumers.agent-surface.example-space-coverage.uncovered-literal" href="#spec-spec%3Aconsumers.agent-surface.example-space-coverage.uncovered-literal">A literal no example binds is reported uncovered, and an unbound child is named</a> · spec:consumers.agent-surface.example-space-coverage.uncovered-literal</li><li><a id="spec-spec%3Aconsumers.agent-surface.example-space-coverage.number-not-enumerable" href="#spec-spec%3Aconsumers.agent-surface.example-space-coverage.number-not-enumerable">A number slot is not enumerable and reports no uncovered value</a> · spec:consumers.agent-surface.example-space-coverage.number-not-enumerable</li><li><a id="spec-spec%3Aconsumers.spec-studio.lenses.evidence" href="#spec-spec%3Aconsumers.spec-studio.lenses.evidence">The evidence lens names each source of runtime evidence and reads it as not tracked</a> · spec:consumers.spec-studio.lenses.evidence</li><li><a id="spec-spec%3Aconsumers.spec-studio.pack-page" href="#spec-spec%3Aconsumers.spec-studio.pack-page">A Pack page shows the Pack's design as one card per member</a> · spec:consumers.spec-studio.pack-page</li><li><a id="spec-spec%3Aconsumers.spec-studio.pack-page.maturity-map" href="#spec-spec%3Aconsumers.spec-studio.pack-page.maturity-map">A Pack page's maturity map places every member by its stated rung and its floor</a> · spec:consumers.spec-studio.pack-page.maturity-map</li><li><a id="spec-spec%3Aconsumers.spec-studio.spec-page" href="#spec-spec%3Aconsumers.spec-studio.spec-page">A Spec page shows one Spec in collapsible panels, in a fixed order</a> · spec:consumers.spec-studio.spec-page</li><li><a id="spec-spec%3Aconsumers.spec-studio.spec-page.cited-declaration" href="#spec-spec%3Aconsumers.spec-studio.spec-page.cited-declaration">A pinned declaration shows the test line that cites it</a> · spec:consumers.spec-studio.spec-page.cited-declaration</li><li><a id="spec-spec%3Aconsumers.spec-studio.spec-page.core" href="#spec-spec%3Aconsumers.spec-studio.spec-page.core">A Spec page's core shows the whole Spec, with an anchor for every entry</a> · spec:consumers.spec-studio.spec-page.core</li><li><a id="spec-spec%3Aconsumers.spec-studio.verification-panels" href="#spec-spec%3Aconsumers.spec-studio.verification-panels">The panels for examples, targets, verifiers and evidence</a> · spec:consumers.spec-studio.verification-panels</li><li><a id="spec-spec%3Aconsumers.spec-studio.verification-panels.rule-coverage" href="#spec-spec%3Aconsumers.spec-studio.verification-panels.rule-coverage">Each keyed rule shows the examples that exercise it, or that none does</a> · spec:consumers.spec-studio.verification-panels.rule-coverage</li><li><a id="spec-spec%3Aconsumers.spec-studio.registers" href="#spec-spec%3Aconsumers.spec-studio.registers">The corpus's registers are pages a reviewer opens from a link</a> · spec:consumers.spec-studio.registers</li><li><a id="spec-spec%3Aconsumers.spec-studio.registers.blocking-first" href="#spec-spec%3Aconsumers.spec-studio.registers.blocking-first">The questions page lists the Specs with a blocking question first</a> · spec:consumers.spec-studio.registers.blocking-first</li><li><a id="spec-spec%3Aconsumers.spec-studio.owner-queue" href="#spec-spec%3Aconsumers.spec-studio.owner-queue">The owner queue page orders the statements and questions only a person can settle</a> · spec:consumers.spec-studio.owner-queue</li><li><a id="spec-spec%3Aconsumers.spec-studio.owner-queue.dependency-first" href="#spec-spec%3Aconsumers.spec-studio.owner-queue.dependency-first">The owner queue lists a waiting statement after the one it rests on</a> · spec:consumers.spec-studio.owner-queue.dependency-first</li><li><a id="spec-spec%3Aconsumers.spec-studio.diff-page" href="#spec-spec%3Aconsumers.spec-studio.diff-page">The diff page shows what changed in the design since a base graph</a> · spec:consumers.spec-studio.diff-page</li><li><a id="spec-spec%3Aconsumers.spec-studio.diff-page.changed-entry" href="#spec-spec%3Aconsumers.spec-studio.diff-page.changed-entry">The diff page shows a changed entry's base and built values</a> · spec:consumers.spec-studio.diff-page.changed-entry</li><li><a id="spec-spec%3Aconsumers.spec-studio.runs-page" href="#spec-spec%3Aconsumers.spec-studio.runs-page">The runs page shows the run records the build was given, joined to test files</a> · spec:consumers.spec-studio.runs-page</li><li><a id="spec-spec%3Aconsumers.spec-studio.runs-page.external-evidence" href="#spec-spec%3Aconsumers.spec-studio.runs-page.external-evidence">The runs page shows a run as external evidence from a test file</a> · spec:consumers.spec-studio.runs-page.external-evidence</li><li><a id="spec-spec%3Aobservation.run-evidence" href="#spec-spec%3Aobservation.run-evidence">CI run records are joined to verifiers in a view</a> · spec:observation.run-evidence</li><li><a id="spec-spec%3Aobservation.run-evidence.absolute-path-joins" href="#spec-spec%3Aobservation.run-evidence.absolute-path-joins">A test whose reporter wrote an absolute path joins its anchored file</a> · spec:observation.run-evidence.absolute-path-joins</li><li><a id="spec-spec%3Aobservation.run-evidence.unanchored-file-unjoined" href="#spec-spec%3Aobservation.run-evidence.unanchored-file-unjoined">A test in a file with no test anchor is reported as unjoined</a> · spec:observation.run-evidence.unanchored-file-unjoined</li><li><a id="spec-spec%3Aconsumers.spec-studio.glossary-page" href="#spec-spec%3Aconsumers.spec-studio.glossary-page">The glossary page lists every term the corpus's Specs define</a> · spec:consumers.spec-studio.glossary-page</li><li><a id="spec-spec%3Aconsumers.spec-studio.glossary-page.same-word-twice" href="#spec-spec%3Aconsumers.spec-studio.glossary-page.same-word-twice">A word two Specs define appears once per Spec on the glossary page</a> · spec:consumers.spec-studio.glossary-page.same-word-twice</li><li><a id="spec-spec%3Aconsumers.spec-studio.intent-panel" href="#spec-spec%3Aconsumers.spec-studio.intent-panel">A composing panel on every page gathers scoped intent for an agent</a> · spec:consumers.spec-studio.intent-panel</li><li><a id="spec-spec%3Aconsumers.spec-studio.intent-panel.refresh-keeps-intents" href="#spec-spec%3Aconsumers.s
