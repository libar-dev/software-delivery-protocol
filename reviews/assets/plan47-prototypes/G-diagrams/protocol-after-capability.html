nsumers.agent-surface.answer-shapes"><title>spec:consumers.agent-surface.answer-shapes</title><rect x="96" y="1608" width="264" height="168" rx="4"/><text x="108" y="1632"><tspan x="108" dy="0">Recipe answers fit an</tspan><tspan x="108" dy="20">agent's context and explain</tspan><tspan x="108" dy="20">their misses</tspan></text><text class="identity" x="108" y="1698"><tspan x="108" dy="0">…consumers.agent-surface.</tspan><tspan x="108" dy="16">answer-shapes</tspan></text><text class="annotation" x="108" y="1744"><tspan x="108" dy="0">story</tspan></text></a></g><g class="node" data-id="spec:consumers.agent-surface.authoring-recipes"><a href="#capability.node.spec%3Aconsumers.agent-surface.authoring-recipes"><title>spec:consumers.agent-surface.authoring-recipes</title><rect x="456" y="1608" width="264" height="168" rx="4"/><text x="468" y="1632"><tspan x="468" dy="0">Authoring questions stay</tspan><tspan x="468" dy="20">executable graph recipes</tspan></text><text class="identity" x="468" y="1678"><tspan x="468" dy="0">…consumers.agent-surface.</tspan><tspan x="468" dy="16">authoring-recipes</tspan></text><text class="annotation" x="468" y="1744"><tspan x="468" dy="0">story</tspan></text></a></g><g class="node" data-id="branch-8"><a href="#capability.node.branch-8"><title>branch-8</title><rect x="96" y="1888" width="264" height="96" rx="4"/><text x="108" y="1912"><tspan x="108" dy="0">30 descendant boxes</tspan></text><text class="identity" x="108" y="1938"><tspan x="108" dy="0">folded · Refinement depth 3</tspan></text></a></g><g class="node" data-id="unreached-group"><a href="#capability.node.unreached-group"><title>unreached-group</title><rect x="96" y="2160" width="264" height="96" rx="4"/><text x="108" y="2184"><tspan x="108" dy="0">112 unreached Specs</tspan></text><text class="identity" x="108" y="2210"><tspan x="108" dy="0">folded · Unreached</tspan></text></a></g></svg></div><details id="diagram.capability.text"><summary>The diagram as text</summary><ul><li id="capability.node.spec%3Aprotocol.self-hosting">spec:protocol.self-hosting: The Protocol authors and validates itself, Epic</li><li id="capability.node.spec%3Aconsumers.projections-model">spec:consumers.projections-model: Projections fan out from one graph without becoming truth stores, Refinement depth 1</li><li id="capability.node.spec%3Aconsumers.agent-surface">spec:consumers.agent-surface: Agents script a visible typed graph, Refinement depth 2</li><li id="capability.node.spec%3Aconsumers.agent-surface.answer-shapes">spec:consumers.agent-surface.answer-shapes: Recipe answers fit an agent's context and explain their misses, Refinement depth 3</li><li id="capability.node.spec%3Aconsumers.agent-surface.authoring-recipes">spec:consumers.agent-surface.authoring-recipes: Authoring questions stay executable graph recipes, Refinement depth 3</li><li id="capability.node.spec%3Aconsumers.agent-surface.demand-map-entries">spec:consumers.agent-surface.demand-map-entries: One body reaches every entry point the demand map names, and no symbol entry, Refinement depth 3</li><li id="capability.node.spec%3Aconsumers.agent-surface.evaluation-sink">spec:consumers.agent-surface.evaluation-sink: The evaluation sink runs one body and prints its return, Refinement depth 3</li><li id="capability.node.spec%3Aconsumers.agent-surface.evaluation-sink.exported-evaluator">spec:consumers.agent-surface.evaluation-sink.exported-evaluator: A script holding a graph runs a shipped recipe through the exported evaluator, Refinement depth 4</li><li id="capability.node.spec%3Aconsumers.agent-surface.evaluation-sink.recipe-call">spec:consumers.agent-surface.evaluation-sink.recipe-call: A body calls a shipped recipe and returns its answer unchanged, Refinement depth 4</li><li id="capability.node.spec%3Aconsumers.agent-surface.evaluation-sink.unknown-recipe">spec:consumers.agent-surface.evaluation-sink.unknown-recipe: A call to a recipe the catalog does not hold fails the body, Refinement depth 4</li><li id="capability.node.spec%3Aconsumers.agent-surface.recipe-parameters">spec:consumers.agent-surface.recipe-parameters: Recipes take parameters as data and ship as runnable files, Refinement depth 3</li><li id="capability.node.spec%3Aconsumers.agent-surface.register-recipes">spec:consumers.agent-surface.register-recipes: Register questions stay executable graph recipes, Refinement depth 3</li><li id="capability.node.spec%3Aconsumers.agent-surface.address-and-cycle-recipes">spec:consumers.agent-surface.address-and-cycle-recipes: Address resolution and dependency cycles stay executable graph recipes, Refinement depth 4</li><li id="capability.node.spec%3Aconsumers.agent-surface.address-and-cycle-recipes.chain-reports-nothing">spec:consumers.agent-surface.address-and-cycle-recipes.chain-reports-nothing: A dependency chain with no cycle yields no finding, Refinement depth 5</li><li id="capability.node.spec%3Aconsumers.agent-surface.address-and-cycle-recipes.cycle-fails-a-rules-run">spec:consumers.agent-surface.address-and-cycle-recipes.cycle-fails-a-rules-run: The shipped dependency-cycles file fails a rules run on a cycle, Refinement depth 5</li><li id="capability.node.spec%3Aconsumers.agent-surface.address-and-cycle-recipes.unresolved-address-fails-a-rules-run">spec:consumers.agent-surface.address-and-cycle-recipes.unresolved-address-fails-a-rules-run: The shipped address-resolution file fails a rules run on an address that names no entry, Refinement depth 5</li><li id="capability.node.spec%3Aconsumers.agent-surface.design-recipes">spec:consumers.agent-surface.design-recipes: Design work reads its answers from catalog recipes, Refinement depth 4</li><li id="capability.node.spec%3Aconsumers.agent-surface.example-space-coverage">spec:consumers.agent-surface.example-space-coverage: Example spaces report which values their examples cover, Refinement depth 5</li><li id="capability.node.spec%3Aconsumers.agent-surface.example-space-coverage.number-not-enumerable">spec:consumers.agent-surface.example-space-coverage.number-not-enumerable: A number slot is not enumerable and reports no uncovered value, Refinement depth 6</li><li id="capability.node.spec%3Aconsumers.agent-surface.example-space-coverage.uncovered-literal">spec:consumers.agent-surface.example-space-coverage.uncovered-literal: A literal no example binds is reported uncovered, and an unbound child is named, Refinement depth 6</li><li id="capability.node.spec%3Aconsumers.agent-surface.scripted-context-body">spec:consumers.agent-surface.scripted-context-body: A scripted body returns claim-decoded context, pre-shaped by the body, Refinement depth 3</li><li id="capability.node.spec%3Aconsumers.context-bundle">spec:consumers.context-bundle: A context bundle is composed per invocation within a stated budget, Refinement depth 3</li><li id="capability.node.spec%3Aconsumers.context-bundle.oversized-member-named">spec:consumers.context-bundle.oversized-member-named: A member larger than the budget is named, and no part is returned, Refinement depth 4</li><li id="capability.node.spec%3Aconsumers.context-bundle.parts-cover-the-pack">spec:consumers.context-bundle.parts-cover-the-pack: A Pack too large for one bundle reads whole in parts, Refinement depth 4</li><li id="capability.node.spec%3Aconsumers.reader">spec:consumers.reader: The reader bridges agent entry points to composable graph context, Refinement depth 3</li><li id="capability.node.spec%3Aconsumers.pack-design">spec:consumers.pack-design: The Pack context carries the Pack's design, Refinement depth 4</li><li id="capability.node.spec%3Aconsumers.design-slice">spec:consumers.design-slice: A slice reads a Pack as one design, with the architecture it touches and what each member needs next, Refinement depth 5</li><li id="capability.node.spec%3Aconsumers.reader.changeset-entry">spec:consumers.reader.changeset-entry: A changeset names what it reaches, why, and what it cannot see, Refinement depth 4</li><li id="capability.node.spec%3Aconsumers.reader.concept-entry">spec:consumers.reader.concept-entry: A concept recorded only inside a Spec's sections is still reached, and the field is named, Refinement depth 4</li><li id="capability.node.spec%3Aconsumers.reader.file-entry">spec:consumers.reader.file-entry: A source file reaches the Spec its binding names, and a carrier reaches its own Spec, Refinement depth 4</li><li id="capability.node.spec%3Aconsumers.reading-on-ramp">spec:consumers.reading-on-ramp: The reading skill teaches agents to query the graph, Refinement depth 3</li><li id="capability.node.spec%3Aconsumers.studio-on-ramp">spec:consumers.studio-on-ramp: The Studio skill teaches agents to publish, share and read the Spec Studio, Refinement depth 4</li><li id="capability.node.spec%3Aconsumers.vault-on-ramp">spec:consumers.vault-on-ramp: The vault skill teaches agents to keep an Obsidian vault of the graph, Refinement depth 4</li><li id="capability.node.spec%3Adecisions.agent-front-door">spec:decisions.agent-front-door: The agent front door is one evaluation sink over the exported reader, Refinement depth 3</li><li id="capability.node.spec%3Adecisions.agent-surface-scripts-graph">spec:decisions.agent-surface-scripts-graph: Agents script the visible graph, Refinement depth 3</li><li id="capability.node.spec%3Aconsumers.capability-map">spec:consumers.capability-map: The capability map reads every epic with the features and stories that refine it, Refinement depth 2</li><li id="capability.node.spec%3Aconsumers.census-page">spec:consumers.census-page: Census renders the runtime taxonomy without becoming a registry, Refinement depth 2</li><li id="capability.node.spec%3Aconsumers.command-line">spec:consumers.command-line: Every verb answers --help, and one verb writes every projection root, Refinement depth 2</li><li id="capability.node.spec%3Aconsumers.command-line.generate-check-failure">spec:consumers.command-line.generate-check-failure: A root that fails its check is removed while sdp generate writes the others, Refinement depth 3</li><li id="capability.node.spec%3Aconsumers.command-line.generate-writes-every-root">spec:consumers.command-line.generate-writes-every-root: One run of sdp generate leaves all five roots current, Refinement depth 3</li><li id="capability.node.spec%3Aconsumers.command-line.verb-help-touches-nothing">spec:consumers.command-line.verb-help-touches-nothing: A publisher's --help prints its help and touches no root, Refinement depth 3</li><li id="capability.node.spec%3Aconsumers.design-diff">spec:consumers.design-diff: Designs are compared between a base commit and the working tree at entry grain, Refinement depth 2</li><li id="capability.node.spec%3Aconsumers.design-review">spec:consumers.design-review: Design Review renders graph context without becoming a gate, Refinement depth 2</li><li id="capability.node.spec%3Aconsumers.binding-language-views">spec:consumers.binding-language-views: Views speak binding language, never the internal fact name, Refinement depth 3</li><li id="capability.node.spec%3Aconsumers.binding-language-views.bound-spec-page">spec:consumers.binding-language-views.bound-spec-page: A fully bound Spec renders binding language on the page and in the index, Refinement depth 4</li><li id="capability.node.spec%3Aconsumers.binding-language-views.pack-member-table">spec:consumers.binding-language-views.pack-member-table: The Pack member table speaks the page's binding language, not a shorthand, Refinement depth 4</li><li id="capability.node.spec%3Aconsumers.derived-readiness-banner">spec:consumers.derived-readiness-banner: Derived readiness renders beside the stated rung and warns in one direction, Refinement depth 3</li><li id="capability.node.spec%3Aconsumers.derived-readiness-banner.dishonest-divergence">spec:consumers.derived-readiness-banner.dishonest-divergence: An overstated rung raises the banner and names the clause that refused, Refinement depth 4</li><li id="capability.node.spec%3Aconsumers.derived-readiness-banner.honest-headroom">spec:consumers.derived-readiness-banner.honest-headroom: A rung the structure overshoots renders as information, not as a banner, Refinement depth 4</li><li id="capability.node.spec%3Aconsumers.design-review.pack-design-page">spec:consumers.design-review.pack-design-page: A Pack page shows where the Pack's design stands, Refinement depth 3</li><li id="capability.node.spec%3Adecisions.pack-design-page">spec:decisions.pack-design-page: The Design Review's Pack page presents the Pack's design, Refinement depth 4</li><li id="capability.node.spec%3Aconsumers.design-review.pure-projection">spec:consumers.design-review.pure-projection: The view is the graph read twice, and the corpus is untouched by reading it, Refinement depth 3</li><li id="capability.node.spec%3Aconsumers.wholesale-view-rewrite">spec:consumers.wholesale-view-rewrite: Every view run rewrites the view wholesale, Refinement depth 3</li><li id="capability.node.spec%3Aconsumers.wholesale-view-rewrite.build-invalidates-view">spec:consumers.wholesale-view-rewrite.build-invalidates-view: A build that never renders still takes the old view down, Refinement depth 4</li><li id="capability.node.spec%3Aconsumers.wholesale-view-rewrite.failed-run-view-removed">spec:consumers.wholesale-view-rewrite.failed-run-view-removed: A run that cannot produce a current view leaves no view at all, Refinement depth 4</li><li id="capability.node.spec%3Aconsumers.wholesale-view-rewrite.late-stale-page">spec:consumers.wholesale-view-rewrite.late-stale-page: A page the build's invalidation never saw still does not survive the swap, Refinement depth 4</li><li id="capability.node.spec%3Aconsumers.wholesale-view-rewrite.stale-page-removed">spec:consumers.wholesale-view-rewrite.stale-page-removed: A page from an earlier run does not survive the next one, Refinement depth 4</li><li id="capability.node.spec%3Adecisions.authored-entry-order">spec:decisions.authored-entry-order: The Design Review renders open-section
